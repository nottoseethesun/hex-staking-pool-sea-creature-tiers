name: Security Audit

# Paused while the project is inactive (it needs a PulseChain archive node):
# the push and pull-request triggers are commented out, so these jobs run only
# when started by hand from the Actions tab. `npm run check` in ci.yml still
# runs the same three audits on every push and pull request. To resume,
# uncomment the triggers here, the schedule in security-audit-production.yml,
# and the security badge in README.md.
on:
  # push:
  #   branches: [main]
  # pull_request:
  #   branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Dependency CVEs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run audit:deps

  security-lint:
    name: Security lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run audit:security

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run audit:secrets
